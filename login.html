<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingia Mfumoni (Login) - NGAE Bakery</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/branding/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/branding/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/branding/apple-touch-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="branding.js"></script>
</head>
<body class="bg-gradient-to-br from-slate-100 via-amber-50/30 to-slate-200 flex flex-col items-center justify-center min-h-screen p-4">

    <!-- BRAND TOP LOGO -->
    <div class="mb-4 text-center">
        <a href="index.html" class="inline-flex items-center gap-3 bg-white/80 backdrop-blur-md px-4 py-2 rounded-2xl shadow-sm border border-white/60 hover:scale-105 transition-transform">
            <img src="assets/branding/ngae-bakery-logo.png" alt="Ngae Bakery" class="w-10 h-10 object-contain drop-shadow-sm">
            <div class="text-left">
                <span class="block text-sm font-black tracking-wider text-red-700">NGAE BAKERY</span>
                <span class="block text-[10px] font-bold text-amber-600 uppercase">Food Processors Hub</span>
            </div>
        </a>
    </div>

    <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border border-slate-100 border-t-4 border-t-red-600 relative overflow-hidden" id="loginContainer">
        
        <div class="text-center mb-6">
            <div id="roleIconContainer" class="inline-flex items-center justify-center w-16 h-16 rounded-2xl mb-4 bg-red-50 text-red-600 p-2 shadow-inner">
                <img src="assets/branding/ngae-bakery-logo.png" alt="Ngae Logo" class="w-full h-full object-contain">
            </div>
            <h2 class="text-2xl font-black text-slate-800 tracking-tight" id="loginTitle">Ingia kama ...</h2>
            <p class="text-slate-500 text-sm mt-1 font-medium">Weka namba yako ya utambulisho (Staff ID)</p>
        </div>

        
        <form id="loginForm">
            <div class="mb-6">
                <label class="block text-slate-700 font-bold mb-2 text-sm">
                    Namba ya Staff ID (Uliyopewa na Admin):
                </label>
                <input type="text" id="staff_id" required placeholder="Weka Staff ID yako hapa..." 
                       class="w-full border border-slate-300 rounded-xl p-3 focus:ring-2 outline-none uppercase font-bold text-slate-800 tracking-wider focus:ring-red-500 focus:border-red-500 transition-all">
            </div>

            <button type="submit" id="loginBtn" class="w-full text-white font-black py-3.5 rounded-xl transition-all shadow-md bg-gradient-to-r from-red-600 to-red-700 hover:from-red-700 hover:to-red-800 hover:shadow-lg active:scale-[0.98]">
                Ingia Ndani
            </button>
        </form>
        
        <div class="mt-6 text-center space-y-2 pt-4 border-t border-slate-100">
            <a href="index.html" class="block text-sm text-slate-500 hover:text-slate-800 font-medium transition-colors">&larr; Rudi nyuma kuchagua upya nafasi</a>
            <a href="admin.html?v=1.1" class="block text-xs text-red-600 hover:underline font-extrabold tracking-wide">Kuingia kama Admin (Kusajili Wafanyakazi Mpya) &rarr;</a>
        </div>
    </div>

    <!-- Firebase SDK (Real-time Sync kati ya vifaa vyote) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const role = urlParams.get('role');
            
            const titleEl = document.getElementById('loginTitle');
            const containerEl = document.getElementById('loginContainer');
            const iconContainerEl = document.getElementById('roleIconContainer');
            const btnEl = document.getElementById('loginBtn');
            
            if (role === 'operator') {
                titleEl.textContent = 'Ingia kama Operator';
                containerEl.className = "bg-white p-8 rounded-2xl shadow-md w-full max-w-md border-t-4 border-orange-500";
                iconContainerEl.className = "inline-flex items-center justify-center w-16 h-16 rounded-full mb-4 bg-orange-100 text-orange-500";
                btnEl.className = "w-full text-white font-bold py-3 rounded-lg transition-colors shadow-sm bg-orange-500 hover:bg-orange-600";
            } else if (role === 'seller') {
                titleEl.textContent = 'Ingia kama Seller';
                containerEl.className = "bg-white p-8 rounded-2xl shadow-md w-full max-w-md border-t-4 border-blue-500";
                iconContainerEl.className = "inline-flex items-center justify-center w-16 h-16 rounded-full mb-4 bg-blue-100 text-blue-500";
                btnEl.className = "w-full text-white font-bold py-3 rounded-lg transition-colors shadow-sm bg-blue-500 hover:bg-blue-600";
            } else if (role === 'storekeeper') {
                titleEl.textContent = 'Ingia kama Store Keeper';
                containerEl.className = "bg-white p-8 rounded-2xl shadow-md w-full max-w-md border-t-4 border-green-500";
                iconContainerEl.className = "inline-flex items-center justify-center w-16 h-16 rounded-full mb-4 bg-green-100 text-green-500";
                btnEl.className = "w-full text-white font-bold py-3 rounded-lg transition-colors shadow-sm bg-green-500 hover:bg-green-600";
            } else if (role === 'manufacturer') {
                titleEl.textContent = 'Ingia kama Manufacturer';
                containerEl.className = "bg-white p-8 rounded-2xl shadow-md w-full max-w-md border-t-4 border-purple-500";
                iconContainerEl.className = "inline-flex items-center justify-center w-16 h-16 rounded-full mb-4 bg-purple-100 text-purple-500";
                btnEl.className = "w-full text-white font-bold py-3 rounded-lg transition-colors shadow-sm bg-purple-500 hover:bg-purple-600";
            } else {
                titleEl.textContent = 'Ingia Mfumoni';
            }

            document.getElementById('loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const staffId = document.getElementById('staff_id').value.toUpperCase();
                
                // Call global login function from app.js
                if(window.appLogin) {
                    window.appLogin(role, staffId);
                }
            });
        });
    </script>
</body>
</html>
